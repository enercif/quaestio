services:
  db:
    image: postgres:18
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: local
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U root -d local']
      interval: 5s
      timeout: 5s
      retries: 10

  quaestio:
    build: .
    restart: always
    env_file: .env
    ports:
      - 3000:3000
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
